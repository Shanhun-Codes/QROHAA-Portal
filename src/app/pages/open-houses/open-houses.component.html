<ng-template #headerActions>
  <aa-button [config]="addOpenHouseButtonConfig"></aa-button>
</ng-template>

<aa-page-template
  [title]="title"
  [subtitle]="subtitle"
  [hasTemplateButton]="true"
  [headerActions]="headerActions"
>
  <div class="table-container">
    <aa-table
      [tableDataConfig]="tableData()"
      [tableHeaderConfig]="tableHeaderConfig"
      [expandedRowTemplate]="expandedRowTemplate"
      (rowExpanded)="onLeadExpanded($event)"
    />

    <ng-template #expandedRowTemplate let-row>
      <div class="lead-expanded-row">
        <aa-open-house-expanded-row
          [openHouseId]="row.id"
        ></aa-open-house-expanded-row>
      </div>
    </ng-template>
  </div>
</aa-page-template>
