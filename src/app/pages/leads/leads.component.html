<ng-template #headerActions>
  <div class="leads-header-actions">
    <div class="lead-view-toggle">
      <button
        type="button"
        class="lead-view-toggle-button"
        [class.active]="leadView() === 'ACTIVE'"
        (click)="leadView.set('ACTIVE')"
      >
        Active
      </button>

      <button
        type="button"
        class="lead-view-toggle-button"
        [class.active]="leadView() === 'CLOSED'"
        (click)="leadView.set('CLOSED')"
      >
        Closed
      </button>
    </div>

    <aa-button [config]="addLeadButtonConfig" />
  </div>
</ng-template>

<aa-page-template
  [title]="title"
  [subtitle]="subtitle"
  [headerActions]="headerActions"
>
  <div class="table-container">
    @if (selectedLeadIds().length > 0) {
      <div class="table-actions-bar">
        <div class="table-actions-selection">
          <div class="table-actions-selection-text">
            <strong>{{ selectedLeadIds().length }}</strong>

            <span>
              {{ selectedLeadIds().length === 1 ? "lead" : "leads" }} selected
            </span>
          </div>

          <button
            type="button"
            class="clear-selection-button"
            (click)="onClearSelectionClick()"
          >
            Clear All
          </button>
        </div>

        <div class="table-actions">
          <aa-select
            placeholder="Change Status"
            [options]="statusOptions"
            [value]="selectedStatus()"
            (valueChange)="onStatusChange($event)"
          />

          <aa-button [config]="updateStatusButtonConfig" />
        </div>
      </div>
    }

    <aa-table
      [tableDataConfig]="tableData()"
      [tableHeaderConfig]="tableHeaderConfig"
      [expandedRowTemplate]="expandedRowTemplate"
      (rowExpanded)="onLeadExpanded($event)"
      (selectionChange)="onSelectionChange($event)"
    />

    <ng-template #expandedRowTemplate let-row>
      <aa-lead-expanded-row [row]="row" />
    </ng-template>
  </div>
</aa-page-template>
