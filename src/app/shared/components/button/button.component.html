<button
  type="button"
  class="btn"
  [class.btn-primary]="config().variant === 'primary'"
  [class.btn-secondary]="config().variant === 'secondary'"
  [class.btn-danger]="config().variant === 'danger'"
  [class.btn-ghost]="config().variant === 'ghost'"
  [class.btn-sm]="config().size === 'sm'"
  [class.btn-lg]="config().size === 'lg'"
  [disabled]="config().disabled"
  (click)="onClick()"
>
  @if (config().icon) {
    <mat-icon>{{ config().icon }}</mat-icon>
  }

  @if (config().label) {
    <span>{{ config().label }}</span>
  }
</button>
